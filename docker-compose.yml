services:
  n8n-worker:
    image: ${N8N_IMAGE:-docker.n8n.io/n8nio/n8n:2.22.5}
    restart: unless-stopped
    command: worker --concurrency=${N8N_WORKER_CONCURRENCY:-10}
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${N8N_POSTGRES_HOST:?}
      DB_POSTGRESDB_PORT: ${N8N_POSTGRES_PORT:-5432}
      DB_POSTGRESDB_DATABASE: ${N8N_POSTGRES_DATABASE:?}
      DB_POSTGRESDB_USER: ${N8N_POSTGRES_USER:?}
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD:?}
      DB_POSTGRESDB_SSL_ENABLED: ${N8N_POSTGRES_SSL_ENABLED:-false}
      DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED: ${N8N_POSTGRES_SSL_REJECT_UNAUTHORIZED:-true}
      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: ${N8N_REDIS_HOST:?}
      QUEUE_BULL_REDIS_PORT: ${N8N_REDIS_PORT:-6379}
      QUEUE_BULL_REDIS_PASSWORD: ${N8N_REDIS_PASSWORD:?}
      QUEUE_BULL_REDIS_DB: ${N8N_REDIS_DB:-0}
      QUEUE_HEALTH_CHECK_ACTIVE: ${QUEUE_HEALTH_CHECK_ACTIVE:-true}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Sao_Paulo}
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: external
      N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?}
    expose:
      - "5679"
    networks:
      - default
      - coolify

  task-runner:
    image: ${N8N_RUNNERS_IMAGE:-n8nio/runners:2.22.5}
    restart: unless-stopped
    depends_on:
      - n8n-worker
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN:?}
      N8N_RUNNERS_MAX_CONCURRENCY: ${N8N_RUNNERS_MAX_CONCURRENCY:-5}
      N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT: ${N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT:-15}
      GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Sao_Paulo}

networks:
  coolify:
    external: true
